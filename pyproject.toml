[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "paper-c-replication"
version = "0.1.0"
description = "Downstream replication of Paper C analyses from precomputed journal scores"
requires-python = ">=3.11"
dependencies = ["numpy>=2.2,<3", "pandas>=2.2,<4", "scipy>=1.15,<2", "matplotlib>=3.9,<4", "Pillow>=11,<13"]

[tool.setuptools]
packages = ["paper_c_replication"]
